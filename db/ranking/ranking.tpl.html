<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>훈감각 어휘 랭킹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 훈감각 공통 랭킹판 — 홈페이지에 링크/iframe으로 넣는 화면 (대표님 2026-10-16)
   오늘의 랭킹(하나로, 영역 내역 함께) + 명예의 전당(영역별) + 토글 [전체|초등|중등] × [전체|우리학원]
   오늘 점수 = 오늘 새로 '내 어휘'가 된 수(여러 회차·재도전 합산)
   명예의 전당 = 영역별 'N회차까지 누적 만점자'(1~N회 빠짐없이 만점), 최근 달성 순 — 앱과 같은 규칙.
     기준 회차는 보는 학생의 그 영역 마지막 훈련 회차(없으면 1), ◀ ▶로 넘겨 봄 (2026-10-17)
   이름은 서버에서 가림(홍*동) — 입장권(?st)으로 확인된 '나'만 전체 이름. 원본: db/ranking/ranking.tpl.html → node db/ranking/build.js 로 ranking.html 생성 */
:root {
  --bg: #F4F6FA; --card: #FFFFFF; --ink: #1A1F30; --sub: #6B7488; --line: #E6E9F0;
  --green: #2FA572; --green-soft: #E7F6EE; --gold: #E0A800; --me: #FFF7DB;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; }
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
.lead { font-size: 14px; color: var(--sub); margin: 0 0 18px; line-height: 1.6; }
.filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.boards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .boards { grid-template-columns: 1fr; } }
.seg { display: inline-flex; background: #E3E7EF; border-radius: 100px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 8px 18px; border-radius: 100px; font: inherit; font-size: 15px; font-weight: 500; color: var(--sub); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.seg button:disabled { opacity: .45; cursor: default; }
.row-label { font-size: 12px; color: var(--sub); margin: 0 0 4px 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 10px; }
.card-head .t { font-size: 16px; font-weight: 600; }
.card-head .r { font-size: 13px; color: var(--sub); white-space: nowrap; }
.me-bar { background: var(--me); padding: 10px 18px; font-size: 14px; border-bottom: 1px solid var(--line); }
.me-bar b { font-weight: 600; color: var(--green); }
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #F0F2F6; }
.item:last-child { border-bottom: 0; }
.item.me { background: var(--me); }
.rk { width: 34px; text-align: center; font-size: 16px; font-weight: 600; color: var(--sub); flex: none; }
.rk.medal { font-size: 22px; }
.who { flex: 1; min-width: 0; }
.nm { font-size: 16px; font-weight: 500; }
.ac { font-size: 12px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt { font-size: 17px; font-weight: 600; color: var(--green); flex: none; }
.cnt small { font-size: 12px; font-weight: 500; color: var(--sub); margin-left: 2px; }
.empty, .loading { padding: 40px 18px; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.7; }
.spin { width: 28px; height: 28px; margin: 0 auto 10px; border: 3px solid var(--green-soft); border-top-color: var(--green); border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.foot { font-size: 12px; color: var(--sub); margin-top: 14px; line-height: 1.7; }
.card-head .d { font-size: 12px; color: var(--sub); font-weight: 400; margin-left: 8px; }
@media (max-width: 640px) { .card-head .d { display: block; margin: 3px 0 0; } }   /* 휴대폰: 설명은 제목 아래 줄 */
.areas { font-size: 12px; color: var(--sub); margin-top: 2px; }
.areas b { font-weight: 500; color: #3B4256; }
.atabs { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.atabs button { border: 1px solid var(--line); background: #fff; border-radius: 100px; padding: 5px 12px; font: inherit; font-size: 13px; color: var(--sub); cursor: pointer; white-space: nowrap; }
.atabs button.on { background: #1A1F30; border-color: #1A1F30; color: #fff; font-weight: 500; }
.crown { font-size: 18px; }
.rnav { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #FBFAF5; }
.rnav .rt { font-size: 15px; font-weight: 600; min-width: 190px; text-align: center; }
.rnav .rt b { color: var(--gold); font-weight: 600; }
.rnav button.ar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 14px; color: var(--ink); cursor: pointer; }
.rnav button.ar:disabled { opacity: .3; cursor: default; }
.rnav .mine { border: 0; background: none; font: inherit; font-size: 12px; color: var(--green); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; }
/* 명예의 전당 한 줄: 왕관 | 이름 | 학원 | 날짜 — 열 너비 고정해 줄마다 가지런히 (대표님 2026-10-18) */
.hall-item { display: grid; grid-template-columns: 30px minmax(84px, 110px) 1fr auto; gap: 12px; align-items: center; }
.hall-item .h-nm { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hall-item .h-ac { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hall-item .h-dt { font-size: 13px; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .hall-item { grid-template-columns: 26px minmax(70px, 90px) 1fr auto; gap: 8px; } }
.rnav .mine { white-space: nowrap; }
@media (max-width: 640px) { .rnav { gap: 6px; } .rnav .rt { min-width: 0; font-size: 14px; } .ac { white-space: normal; } }   /* 휴대폰: 회차 줄 좁게, 학원·날짜는 줄바꿈 */
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 훈감각 어휘 랭킹</h1>
  <p class="lead">오늘 새로 <b>'내 어휘'</b>로 익힌 어휘 수로 겨루고, 1회차부터 빠짐없이 만점을 이어 간 친구는 <b>명예의 전당</b>에 올라요.</p>

  <div class="filters">
    <div class="seg" id="f-level"><button data-v="">전체</button><button data-v="초등">초등</button><button data-v="중등">중등</button></div>
    <div class="seg" id="f-scope"><button data-v="all">전체</button><button data-v="academy" id="btn-academy">우리학원</button></div>
  </div>

  <div class="boards">
    <div class="card">
      <div class="card-head"><span class="t">오늘의 랭킹<span class="d">오늘 새로 익힌 어휘</span></span><span class="r" id="range-day"></span></div>
      <div class="me-bar" id="me-day" hidden></div>
      <div id="body-day"><div class="loading"><div class="spin"></div>불러오는 중이에요</div></div>
    </div>
    <div class="card">
      <div class="card-head"><span class="t">명예의 전당 👑<span class="d">1회차부터 빠짐없이 만점</span></span><span class="r" id="range-hall"></span></div>
      <div class="atabs" id="f-area"></div>
      <div class="rnav"><button class="ar" id="r-prev" aria-label="이전 회차">◀</button><span class="rt" id="r-title"></span><button class="ar" id="r-next" aria-label="다음 회차">▶</button><button class="mine" id="r-mine" hidden>내 회차</button></div>
      <div class="me-bar" id="me-hall" hidden></div>
      <div id="body-hall"><div class="loading"><div class="spin"></div>불러오는 중이에요</div></div>
    </div>
  </div>
  <div class="foot">· 이름은 일부를 가려서 보여 줘요.<br>· 오늘의 랭킹은 매일 0부터 다시 시작해요.<br>· 명예의 전당은 1회차부터 그 회차까지 빠짐없이 모든 어휘를 모은(만점) 친구예요. 최근에 달성한 친구가 맨 위에 와요. (100명)<br>· ◀ ▶ 로 다른 회차의 명예의 전당도 볼 수 있어요.</div>
</div>

<script>
(function(){
  // 서버 — 테섭(word.sfos.kr·localhost)은 테스트 DB, 그 밖은 운영 DB (훈련 앱과 같은 규칙)
  var host = location.hostname;
  var TEST = host === 'word.sfos.kr' || host === 'localhost' || host === '127.0.0.1';
  var URL_ = TEST ? '__DEV_URL__' : '__PROD_URL__';
  var KEY_ = TEST ? '__DEV_KEY__' : '__PROD_KEY__';

  var q = new URLSearchParams(location.search);
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  // 우리학원: 주소의 ?academy=학원번호 (훈련 앱 결과 화면·홈페이지에서 넘겨줌) → 이 브라우저에 기억
  var academy = q.get('academy') || lsGet('ws_rank_academy');
  if (q.get('academy')) lsSet('ws_rank_academy', q.get('academy'));
  var me = q.get('me');   // 훈련 앱에서 열었을 때 '나' 표시
  var ticket = /^[0-9a-f-]{36}$/i.test(q.get('st') || '') ? q.get('st') : null;   // 입장권 — 서버가 확인하면 '나'만 전체 이름 (2026-10-18)

  var AREAS = [['biology','생물'],['society','사회'],['history','역사'],['science','과학'],['culture','문화'],['economy','경제']];
  var qa = q.get('area'), la = lsGet('ws_rank_area');
  var st = {
    level: ['초등', '중등'].indexOf(q.get('level')) > -1 ? q.get('level') : '',
    scope: academy && q.get('scope') !== 'all' ? 'academy' : 'all',
    area: AREAS.some(function(a){ return a[0] === qa; }) ? qa : AREAS.some(function(a){ return a[0] === la; }) ? la : 'biology'
  };
  document.getElementById('f-area').innerHTML = AREAS.map(function(a){ return '<button data-v="' + a[0] + '">' + a[1] + '</button>'; }).join('');
  if (!academy) { var ba = document.getElementById('btn-academy'); ba.disabled = true; ba.title = '훈련 화면의 랭킹 버튼으로 들어오면 볼 수 있어요'; }

  function bindSeg(id, key){
    var el = document.getElementById(id);
    function paint(){ el.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === st[key]); }); }
    el.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b || b.disabled) return;
      st[key] = b.dataset.v; paint(); load();
    });
    paint();
  }
  bindSeg('f-level', 'level'); bindSeg('f-scope', 'scope');
  (function(){   // 명예의 전당 영역 탭 — 이 표만 다시 불러옴, 고른 영역은 이 브라우저에 기억
    var el = document.getElementById('f-area');
    function paint(){ el.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === st.area); }); }
    el.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      st.area = b.dataset.v; lsSet('ws_rank_area', st.area); hr.round = null; paint(); loadHall(++hseq);
    });
    paint();
  })();

  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function fmtDay(d){ var p = String(d).split('-'); return Number(p[1]) + '월 ' + Number(p[2]) + '일'; }
  var seq = 0;
  function loadOne(period, my){
    var sfx = 'day';
    var body = document.getElementById('body-' + sfx);
    body.innerHTML = '<div class="loading"><div class="spin"></div>불러오는 중이에요</div>';
    return fetch(URL_ + '/rest/v1/rpc/wordsense_rank_board', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY_, Authorization: 'Bearer ' + KEY_ },
      body: JSON.stringify({ p_period: period, p_level: st.level || null,
        p_academy_no: st.scope === 'academy' && academy ? Number(academy) : null,
        p_limit: 50, p_member_no: me ? Number(me) : null, p_ticket: ticket })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (my !== seq) return;
      if (!d || !d.rows) throw new Error((d && d.message) || '불러오지 못했어요');
      document.getElementById('range-' + sfx).textContent = fmtDay(d.to);
      var mb = document.getElementById('me-' + sfx);
      if (me && d.me) { mb.hidden = false; mb.innerHTML = '나는 <b>' + d.me.rank + '위</b> · <b>' + d.me.count + '개</b> (참여 ' + d.total + '명)'; }
      else if (me) { mb.hidden = false; mb.textContent = '오늘 새로 익힌 어휘가 아직 없어요. 훈련하면 순위에 올라가요!'; }
      else mb.hidden = true;
      if (!d.rows.length) { body.innerHTML = '<div class="empty">아직 기록이 없어요.<br>먼저 훈련하고 1등을 차지해 보세요! 🚀</div>'; return; }
      var medals = ['🥇', '🥈', '🥉'];
      body.innerHTML = '<ol class="list">' + d.rows.map(function(r){
        var m = r.rank <= 3;
        return '<li class="item' + (r.me ? ' me' : '') + '"><span class="rk' + (m ? ' medal' : '') + '">' + (m ? medals[r.rank - 1] : r.rank) + '</span>'
          + '<div class="who"><div class="nm">' + esc(r.name) + (r.me ? ' (나)' : '') + '</div>'
          + ((r.areas && r.areas.length) ? '<div class="areas">' + r.areas.map(function(a){ return esc(a.area) + ' <b>' + a.n + '</b>'; }).join(' · ') + '</div>' : '')
          + (r.academy ? '<div class="ac">' + esc(r.academy) + '</div>' : '') + '</div>'
          + '<span class="cnt">' + r.count + '<small>개</small></span></li>';
      }).join('') + '</ol>';
    }).catch(function(e){
      if (my !== seq) return;
      body.innerHTML = '<div class="empty">랭킹을 불러오지 못했어요. 잠시 후 다시 열어 주세요.</div>';
      console.error('[ranking]', e);
    });
  }
  var hseq = 0;
  var hr = { round: null, max: 50, mine: null };   // 명예의 전당 기준 회차 (null = 서버가 내 회차로)
  document.getElementById('r-prev').addEventListener('click', function(){ if (hr.round > 1) { hr.round--; loadHall(++hseq); } });
  document.getElementById('r-next').addEventListener('click', function(){ if (hr.round < hr.max) { hr.round++; loadHall(++hseq); } });
  document.getElementById('r-mine').addEventListener('click', function(){ hr.round = hr.mine; loadHall(++hseq); });
  function paintRound(areaKo){
    document.getElementById('r-title').innerHTML = esc(areaKo) + ' <b>' + hr.round + '회차</b>까지 누적 만점자';
    document.getElementById('r-prev').disabled = hr.round <= 1;
    document.getElementById('r-next').disabled = hr.round >= hr.max;
    document.getElementById('r-mine').hidden = !(hr.mine && hr.mine !== hr.round);
  }
  function loadHall(my){
    var body = document.getElementById('body-hall');
    body.innerHTML = '<div class="loading"><div class="spin"></div>불러오는 중이에요</div>';
    var areaKo = (AREAS.filter(function(a){ return a[0] === st.area; })[0] || [, ''])[1];
    return fetch(URL_ + '/rest/v1/rpc/wordsense_rank_hall_board', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY_, Authorization: 'Bearer ' + KEY_ },
      body: JSON.stringify({ p_area: st.area, p_level: st.level || null,
        p_academy_no: st.scope === 'academy' && academy ? Number(academy) : null,
        p_limit: 100, p_member_no: me ? Number(me) : null, p_round: hr.round, p_ticket: ticket })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (my !== hseq) return;
      if (!d || !d.rows) throw new Error((d && d.message) || '불러오지 못했어요');
      document.getElementById('range-hall').textContent = st.scope === 'academy' ? (d.academy_name || '우리학원') : '전국';
      hr.round = d.round; hr.max = d.max_round || 50; hr.mine = d.my_round || null; paintRound(areaKo);
      var mb = document.getElementById('me-hall');
      if (me && d.me) { mb.hidden = false; mb.innerHTML = '나도 명예의 전당에 있어요! <b>' + d.me.rank + '번째</b>'; }
      else if (me) { mb.hidden = false; mb.textContent = '1회차부터 ' + d.round + '회차까지 모든 어휘를 모으면 여기에 올라요!'; }
      else mb.hidden = true;
      if (!d.rows.length) { body.innerHTML = '<div class="empty">아직 ' + esc(areaKo) + ' ' + d.round + '회차 명예의 전당에 오른 친구가 없어요.<br>첫 번째 주인공이 되어 보세요! 👑</div>'; return; }
      body.innerHTML = '<ol class="list">' + d.rows.map(function(r){
        return '<li class="item hall-item' + (r.me ? ' me' : '') + '"><span class="rk crown">👑</span>'
          + '<span class="h-nm">' + esc(r.name) + (r.me ? ' (나)' : '') + '</span>'
          + '<span class="h-ac">' + esc(r.academy || '') + '</span>'
          + '<span class="h-dt">' + (r.at || '') + '</span></li>';
      }).join('') + '</ol>';
    }).catch(function(e){
      if (my !== hseq) return;
      body.innerHTML = '<div class="empty">명예의 전당을 불러오지 못했어요. 잠시 후 다시 열어 주세요.</div>';
      console.error('[ranking hall]', e);
    });
  }
  function load(){ var my = ++seq; loadOne('day', my); loadHall(++hseq); }
  load();
})();
</script>
</body>
</html>
