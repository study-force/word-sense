<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>훈감각 훈련결과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gray-h:#a3a3a3; --gray-h2:#999999; --ink:#2b2f36; --mut:#8b929c; --line:#e4e7ec; --rose:#d87878; --accent:#cd5a29;
    --biology:#5EBE7E; --society:#A87BD6; --history:#E5C257; --science:#8FA0BD; --culture:#E889A8; --economy:#7BB6E6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#dfe2e6;font-family:'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:auto}
  .stage{position:relative;flex:0 0 auto}
  .sheet{position:absolute;top:0;left:0;width:760px;height:1085px;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;transform-origin:top left}
  .hd{position:relative;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,var(--gray-h),var(--gray-h2));color:#fff;height:74px;padding:0 24px;flex:0 0 auto}
  .hd .htitle{font-size:22px;font-weight:600;letter-spacing:.01em;white-space:nowrap;line-height:1}
  .hd .htitle .hk{color:#FFE08A}
  .hd .course{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;opacity:.95;font-weight:600;white-space:nowrap}
  .hd .stu .sch{font-size:13.5px;opacity:.9} .hd .stu .nm{font-size:25px;font-weight:600;letter-spacing:.04em;margin-left:10px}
  .title{text-align:center;font-size:29px;font-weight:600;color:#666666;padding:3px 0 2px;letter-spacing:.02em}
  .title:empty{display:none}
  .title .mk{color:#9aa0a8;font-size:19px;margin-right:6px}
  .dots{display:flex;justify-content:center;gap:8px;padding-bottom:6px}
  .dots .d{width:26px;height:26px;border-radius:50%;background:#e4e7ec;color:#9aa0a8;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .dots .d.on{background:#6f757e;color:#fff}
  .body{flex:1 1 auto;min-height:0;padding:54px 22px 16px;display:flex;flex-direction:column;justify-content:flex-start}
  .pg{display:none} .pg.on{display:block}
  /* page1 훈사전 탭 */
  .tabs{grid-column:1;grid-row:1;display:flex;gap:5px;justify-content:space-between;flex-wrap:wrap;margin:0;align-self:center}
  .tab{padding:5px 9px;border-radius:999px;border:1.5px solid #e2e6ea;background:#fff;font-size:12px;font-weight:700;color:#8b929c;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
  .tab .dt{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .tab.on{color:#fff;border-color:transparent}
  .p1row{display:grid;grid-template-columns:396px 216px;gap:32px 30px;align-items:stretch;justify-content:center}
  .agrid{grid-column:1;grid-row:2;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .ipanel{grid-column:2;grid-row:2;min-width:0;margin-top:-3px;padding-top:2px;display:flex;flex-direction:column}
  .iahead{grid-column:2;grid-row:1;align-self:center;position:relative;top:7px;font-size:26px;font-weight:600;color:#3b414a}
  .iahead .at{display:block;white-space:nowrap}
  .iahead .aperiod{display:block;margin-top:5px;font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
  .itotal{margin:2px 0 16px;padding:14px 15px;background:#5a616b;border-radius:11px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .itotal .tl{font-size:12.5px;color:rgba(255,255,255,.82);font-weight:700;margin-bottom:6px}
  .itotal .tnum{font-size:48px;font-weight:800;line-height:1;letter-spacing:-.01em}
  .itotal .ttot{font-size:14px;color:rgba(255,255,255,.72);font-weight:700;margin-top:6px}
  .ac{position:relative;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 2px;height:72px;border:1px solid transparent;overflow:hidden}
  .ac .ch{font-size:28px;font-weight:400;line-height:1;font-family:'Noto Serif CJK KR','Noto Serif KR',serif}
  .ac .hn{font-size:9px;color:#5A6178;line-height:1;letter-spacing:.02em;text-align:center}
  .ac.lock{background:rgba(0,0,0,.02);border:1px dashed rgba(20,25,40,.18)}
  .ac.lock .ch{color:rgba(20,25,40,.24)} .ac.lock .hn{color:rgba(20,25,40,.2)}
  .ac.pass{background:#fff;border:1.5px solid var(--ac,#5EBE7E);box-shadow:0 0 0 1px rgba(0,0,0,.02)}
  .ac.pass.perfect{background:color-mix(in srgb, var(--ac) 16%, #fff)}
  .ac.fail{background:rgba(90,97,107,.10);border:1.5px solid rgba(90,97,107,.55)}   /* 진행 중(80% 미만) — 빨강 대신 진한 회색 (2026-10-17) */
  .ac .frac{font-size:11px;font-weight:800;color:#5A616B;letter-spacing:.01em}
  .ac .rt{position:absolute;top:3px;right:4px;font-size:8.5px;font-weight:800;color:#aab0b8;line-height:1}
  .ac .star{position:absolute;top:3px;left:4px;font-size:11px;line-height:1;color:#F2B01E}
  .sum{display:flex;flex-direction:column;gap:9px}
  .sum .sitem{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:#eaedf1;border-radius:9px;font-size:13.5px;color:#6b727b;font-weight:600}
  .sum .sitem .v{font-weight:800;font-size:18px;color:#3b414a}
  .sum .sitem .v .u{font-size:12px;font-weight:600;color:var(--mut)}
  .sum .period{display:flex;flex-direction:column;gap:3px;padding:10px 13px;background:#f7f8fa;border-radius:9px}
  .sum .period .pl{font-size:12.5px;color:var(--mut);font-weight:700}
  .sum .period .pv{font-size:13.5px;font-weight:800;color:#3b414a}
  .sum .brk{display:flex;gap:6px}
  .sum .brk .b{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-weight:700;font-size:12px}
  .sum .brk .b .n{display:block;font-size:19px;font-weight:800;margin-top:2px}
  .leg1{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:#6b727b;margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
  .leg1 .sw{width:13px;height:13px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:5px;border:1.5px solid transparent}
  /* page2 통계 */
  .kpi{text-align:center;margin:7px 0 6px}
  .kpi .lab{font-size:13px;color:var(--mut);letter-spacing:.1em;margin-bottom:5px} .kpi .big{font-size:33px;font-weight:800;letter-spacing:-.01em} .kpi .big .t{color:var(--mut);font-size:21px;font-weight:700}
  /* 영역별 현황 표 전체 — 너비 75%, 가운데 정렬 */
  .stable{width:75%;margin:0 auto}
  .shead,.srow{display:grid;grid-template-columns:60px 1fr 84px 52px 52px;gap:9px;align-items:center}
  .shead{font-size:11px;color:var(--mut);font-weight:700;padding-bottom:4px;border-bottom:2px solid #d9dde2} .shead .c{text-align:center}
  #statRows{margin:5px 0 30px}   /* 상단선 아래 5px · 하단선 아래 30px */
  .srow{padding:6px 0}
  #statRows .srow:last-child{border-bottom:1px solid var(--line);padding-bottom:11px}   /* 하단선 위 +5px */
  .srow .an{font-size:15px;font-weight:700}
  /* 막대 — 앱과 동일 비율(얇은 캡슐 15px, 숫자는 바깥 열로 분리) */
  .bar{height:15px;background:#eef0f2;border-radius:7.5px;position:relative;overflow:hidden}
  .bar .fill{height:100%;border-radius:7.5px}
  .sfrac{text-align:right;white-space:nowrap;font-size:12px;font-weight:600;color:#9099a3;font-feature-settings:'tnum' on;font-variant-numeric:tabular-nums}
  .sfrac .fa{font-size:15px;font-weight:800} .sfrac .fp{font-size:11px}
  .scell{text-align:center} .scell .v{font-size:18px;font-weight:800} .scell .u{font-size:10px;color:var(--mut)}
  .src{font-size:10.5px;color:#aeb4bc;text-align:center;padding:12px 0 2px}
  /* page2 하단 — 등급별 어휘 학습 현황 (세로 막대: x축=등급 가로배열, 높이=습득률) */
  .st-donut{margin:0 auto 0;padding-top:30px}
  .gr-title{text-align:center;font-size:17px;font-weight:600;color:#3b414a;margin:0 0 3px;letter-spacing:.01em}
  .gr-note{display:block;text-align:center;font-size:12.5px;color:#9099a3;font-weight:600;margin-bottom:20px}
  .gc-chart{display:flex;justify-content:center;align-items:flex-end;gap:26px;max-width:470px;margin:0 auto;padding:0 6px 10px;border-bottom:1.5px solid #e2e6ea}
  .gc-col{display:flex;flex-direction:column;align-items:center;width:54px}
  .gc-pct{font-size:24px;font-weight:800;line-height:1;margin-bottom:9px;letter-spacing:-.02em;color:#2f8468}
  .gc-pct .gc-sign{font-size:14px;font-weight:700;margin-left:1px}
  .gc-track{width:42px;height:132px;background:#eef0f2;border-radius:10px;position:relative;overflow:hidden}
  .gc-fill{position:absolute;left:0;right:0;bottom:0;border-radius:10px;background:#3f9d7e}
  .gc-g{font-size:15px;font-weight:700;color:#3b414a;margin-top:10px}
  .gc-n{font-size:12.5px;color:#9099a3;margin-top:3px;font-feature-settings:'tnum' on;font-variant-numeric:tabular-nums}
  .gc-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;max-width:470px;margin:15px auto 0}
  .gc-legend .gl-cap{flex-basis:100%;text-align:center;font-size:12.5px;color:#aeb4bc;font-weight:600;margin-bottom:3px;letter-spacing:.02em}
  .gc-legend .gl-item{font-size:13px;color:#9099a3;letter-spacing:.01em}
  .gc-legend .gl-item b{font-weight:600;color:#5a616b;margin-right:3px}
  /* page3 실력 점검 결과 — 5회차마다 25문항, 대표 점수 = 최고 점수 (2026-10-18) */
  .pc-wrap{width:642px;margin:0 auto}   /* 1쪽 훈사전(396+30+216)과 같은 폭 */
  .pc-tabs{display:flex;gap:6px;justify-content:center;margin:2px 0 18px}
  .pc-tabs .tab{padding:5px 13px;font-size:13px}
  .pc-tabs .tab.off{opacity:.45}
  .pc-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px}
  .pc-kpi{background:#f3f5f7;border-radius:9px;padding:11px 8px 10px;text-align:center}
  .pc-kpi .l{font-size:12.5px;color:var(--mut);font-weight:600}
  .pc-kpi .v{font-size:27px;font-weight:600;color:#3b414a;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
  .pc-kpi .v small{font-size:13px;color:var(--mut);font-weight:500;margin-left:2px}
  .pc-sec{font-size:15.5px;font-weight:600;color:#3b414a;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
  .pc-sec .n{font-size:12px;color:#9aa0a8;font-weight:500}
  table.pc-ut{width:100%;margin:0 0 20px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  table.pc-ut th{font-size:11.5px;color:var(--mut);font-weight:600;padding:0 4px 5px;border-bottom:2px solid #d9dde2;text-align:center}
  table.pc-ut td{padding:5px 4px;border-bottom:1px solid #eef0f2;text-align:center;color:#4a515b;height:30px}
  table.pc-ut td.u{font-weight:600;color:#3b414a;text-align:left;padding-left:8px}
  table.pc-ut td.r,table.pc-ut td.m{color:#9aa0a8;font-size:12px}
  table.pc-ut tr.none td{color:#c2c8cf}
  .pc-bar{height:11px;background:#eef0f2;border-radius:6px;overflow:hidden}
  .pc-bar i{display:block;height:100%;border-radius:6px}
  .pc-sc{font-weight:600;font-size:15px}
  .pc-stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:#eef0f2}
  .pc-stack i{display:block;height:100%}
  .pc-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:#6b727b;margin:8px 0 20px}
  .pc-leg b{font-weight:600;color:#3b414a;margin-left:3px;font-variant-numeric:tabular-nums}
  .pc-leg .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .pc-rchart{display:grid;grid-template-columns:repeat(50,1fr);gap:2px;align-items:end;height:110px;border-bottom:1.5px solid #d9dde2}
  .pc-rchart .c{height:100%;display:flex;align-items:flex-end}
  .pc-rchart .c i{display:block;width:100%;border-radius:2px 2px 0 0}
  .pc-rchart .c.no i{background:#eef0f2;height:4px}
  .pc-rax{display:grid;grid-template-columns:repeat(50,1fr);gap:2px;font-size:10px;color:#aeb4bc;margin:3px 0 0}
  .pc-rax span{text-align:center}
  .pc-empty{color:#aeb4bc;font-size:14px;text-align:center;padding:60px 0}
  /* foot + nav */
  .footbar{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 24px 16px;flex:0 0 auto}
  .footbar .btn{background:#5a616b;color:#fff;border:none;border-radius:4px;padding:7px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
  .footbar .pgnav{display:flex;align-items:center;gap:14px}
  .footbar .pa{box-sizing:content-box;width:0;height:0;background:none;border-style:solid;cursor:pointer;padding:0}
  .footbar .pa.l{border-width:19px 28px 19px 0;border-color:transparent #666666 transparent transparent}
  .footbar .pa.r{border-width:19px 0 19px 28px;border-color:transparent transparent transparent #cd5a29}
  .foot{background:#cccccc;display:flex;align-items:center;justify-content:center;height:29px;padding:0 24px;flex:0 0 auto}
  .foot .ac2{font-size:16px;line-height:1;color:#333333;font-weight:600;position:relative;top:-2px}
  @media print{
    body{background:#fff;display:block;height:auto;margin:0}
    .stage{position:static!important;transform:none!important;width:auto!important;height:auto!important;display:block}
    /* ↓↓↓ 인쇄 크기 조절: zoom 숫자를 바꾸면 전체가 커지고/작아짐 (1=100%, 0.96=96%). 낮추면 작아져 아래 여백↑ ↓↓↓ */
    .sheet{position:static!important;transform:none!important;box-shadow:none;width:100%;height:auto;zoom:1;margin:0;display:flex;flex-direction:column;overflow:hidden;page-break-after:always;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .print-last{page-break-after:auto}
    .noprint,.footbar{display:none!important}
    /* ↓ 푸터 위치: 숫자↑ = 푸터 아래로 내려감(내용~푸터 사이 여백↑), 음수 = 위로 올림. 38px≈10mm ↓ */
    .foot{margin-top:38px}
    @page{size:A4 portrait;margin:5mm}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
  <div class="sheet" id="sheet">
    <div class="hd">
      <div class="htitle">한자어<span class="hk">[훈]</span>독해</div>
      <div class="course" id="course"></div>
      <div class="stu"><span class="sch" id="sch"></span><span class="nm" id="nm"></span></div>
    </div>
    <div class="body">
      <div class="pg on" id="pg1">
        <div class="p1row">
          <div class="tabs" id="tabs"></div>
          <div class="iahead"><span class="at" id="atName"></span><span class="aperiod" id="atPeriod"></span></div>
          <div class="agrid" id="agrid"></div>
          <div class="ipanel">
            <div class="itotal"><div class="tl">습득 어휘</div><b class="tnum" id="atAcq">0</b><div class="ttot">총 <span id="atTotal">0</span>개</div></div>
            <div class="sum" id="sum"></div>
            <div class="leg1">
              <span><span class="sw" style="border-color:var(--biology);background:#fff"></span>통과 (어휘 80% 이상 수집)</span>
              <span><span class="sw" style="border-color:rgba(90,97,107,.55);background:rgba(90,97,107,.10)"></span>진행 중 (80% 미만)</span>
              <span><span class="sw" style="border:1px dashed rgba(20,25,40,.25);background:#fff"></span>미훈련(잠금)</span>
              <span><span class="sw" style="border-color:var(--biology);background:color-mix(in srgb,var(--biology) 16%,#fff)"></span><span style="color:#F2B01E;margin-right:2px">★</span>PERFECT (전 어휘 수집)</span>
              <span><b style="color:#8b929c">×</b> 숫자 = 회차별 재시도 횟수</span>
            </div>
          </div>
        </div>
      </div>
      <div class="pg" id="pg2">
        <div class="title">영역별 훈련 현황</div>
        <div class="kpi"><div class="lab">전체 습득 어휘</div><div class="big"><span id="accT">0</span><span class="t"> / <span id="totT">0</span>개</span></div></div>
        <div class="stable">
          <div class="shead"><div>영역</div><div style="grid-column:span 2">습득 어휘</div><div class="c">통과 회차</div><div class="c">PERFECT</div></div>
          <div id="statRows"></div>
        </div>
        <div class="st-donut" id="st-donut"></div>
        <div class="src">출처: 국립국어원 한국어 기초 어휘 · 표준국어대사전</div>
      </div>
      <div class="pg" id="pg3">
        <div class="title">실력 점검 결과</div>
        <div class="pc-wrap">
          <div class="pc-tabs" id="pcTabs"></div>
          <div id="pcBody"></div>
        </div>
      </div>
    </div>
    <div class="footbar noprint">
      <button class="btn print" onclick="window.print()">선택 출력</button>
      <div class="pgnav">
        <button class="pa l" id="navL" onclick="go(-1)" aria-label="이전"></button>
        <button class="pa r" id="navR" onclick="go(1)" aria-label="다음"></button>
      </div>
    </div>
    <div class="foot">
      <div class="ac2" id="academy"></div>
    </div>
  </div>

<script>

function genRounds(ko,cleared){ return CH[ko].map((x,i)=>{ const r=i+1,total=TOTS[i%TOTS.length];
  if(r<=cleared){ const found=(r%5===0)?total:Math.max(need(total),total-(r%4)*4); return {r,c:x.c,h:x.h,total,found,st:"pass",retry:r%3}; }
  if(r<=cleared+3){ return {r,c:x.c,h:x.h,total,found:Math.max(0,need(total)-1-(r%6)),st:"fail",retry:1+(r%3)}; }  /* 미통과(진행 중) = 회차 어휘 80% 미만 (2026-10-17) */
  return {r,c:x.c,h:x.h,total:0,found:0,st:"lock",retry:0}; }); }

    if(r.st==="pass") inner+='<div class="frac" style="color:'+col+'">'+r.found+'/'+r.total+'</div>';

// ── 3쪽 실력 점검 결과 — 구간(5회차)마다 대표 점수 = 최고 점수, 구성·회차별 정답률도 최고 점수 점검 기준 ──
const RES=[["known","완전 습득","#3b7ddd"],["infer","추론","#f2c230"],["wrong","틀림","#e05a5a"]];   // 파랑 / 노랑 / 빨강 (대표님 2026-10-18)   // 결과 구성 (대표님 2026-10-18): 틀림 = 한자 보고도 틀림 + 틀림
const BLUE="#3b7ddd";   // 3쪽 점수·막대 색 하나로 (대표님 2026-10-18 — 점수에 빨강·주황 안 씀)
function testsByUnit(slug){ const u={}; (D.tests||[]).filter(t=>t.area===slug).forEach(t=>(u[t.unit]=u[t.unit]||[]).push(t)); return u; }
function bestOf(l){ return l.reduce((b,t)=>(t.score>b.score||(t.score===b.score&&String(t.at)>String(b.at)))?t:b, l[0]); }
function renderTests(){
  const slug=curArea, us=testsByUnit(slug);
  document.getElementById("pcTabs").innerHTML=AREAS.map(([k,s])=>{ const on=s===slug, has=(D.tests||[]).some(t=>t.area===s);
    return '<div class="tab'+(on?' on':'')+(has?'':' off')+'" onclick="curArea=\''+s+'\';renderArea();renderTests()" style="'+(on?'background:'+COLOR[s]:'')+'"><span class="dt" style="background:'+(on?'#fff':COLOR[s])+'"></span>'+k+'</div>'; }).join("");
  const body=document.getElementById("pcBody"), lists=Object.values(us);
  if(!lists.length){ body.innerHTML='<div class="pc-empty">아직 이 영역의 실력 점검 기록이 없어요<br><span style="font-size:12.5px">5회차를 모두 통과(어휘 80% 이상)하면 점검할 수 있어요</span></div>'; return; }
  const bests=lists.map(bestOf);
  const avg=Math.round(bests.reduce((a,t)=>a+t.score,0)/bests.length), top=Math.max(...bests.map(t=>t.score));
  const kpi=(l,v,u,c)=>'<div class="pc-kpi"><div class="l">'+l+'</div><div class="v"'+(c?' style="color:'+c+'"':'')+'>'+v+'<small>'+u+'</small></div></div>';
  let h='<div class="pc-kpis">'+kpi("점검한 구간",lists.length," / 10")+kpi("평균 점수",avg,"점",BLUE)+kpi("최고 점수",top,"점",BLUE)+'</div>';
  h+='<div class="pc-sec">구간별 점수 <span class="n">5회차마다 25문항 · 100점 만점 · 여러 번 점검하면 최고 점수</span></div>';
  h+='<table class="pc-ut"><tr><th style="width:78px;text-align:left;padding-left:8px">구간</th><th>최고 점수</th><th style="width:44px"></th><th style="width:52px">횟수</th><th style="width:92px">점검일</th></tr>';
  for(let u=1;u<=10;u++){ const l=us[u], rr=((u-1)*5+1)+"~"+(u*5);
    if(!l){ h+='<tr class="none"><td class="u" style="color:#c2c8cf">'+rr+'회차</td><td><div class="pc-bar"></div></td><td>–</td><td></td><td></td></tr>'; continue; }
    const b=bestOf(l), sc=b.score;
    h+='<tr><td class="u">'+rr+'회차</td><td><div class="pc-bar"><i style="width:'+Math.max(sc,2)+'%;background:'+BLUE+'"></i></div></td>'
      +'<td class="pc-sc" style="color:'+BLUE+'">'+sc+'</td><td class="m">'+l.length+'회</td><td class="m">'+(b.at||"")+'</td></tr>'; }
  h+='</table>';
  const cnt={known:0,infer:0,wrong:0}; bests.forEach(t=>{ cnt.known+=t.n_known||0; cnt.infer+=t.n_hanja||0; cnt.wrong+=(t.n_hanja_wrong||0)+(t.n_wrong||0); });
  const tot=RES.reduce((a,[k])=>a+cnt[k],0);
  h+='<div class="pc-sec">결과 구성 <span class="n">구간마다 최고 점수 점검 기준 · '+tot+'문항</span></div>';
  h+='<div class="pc-stack">'+RES.map(([k,,c])=>cnt[k]?'<i style="width:'+(cnt[k]/tot*100)+'%;background:'+c+'"></i>':'').join("")+'</div>';
  h+='<div class="pc-leg">'+RES.map(([k,ko,c])=>'<span><i class="sw" style="background:'+c+'"></i>'+ko+'<b>'+cnt[k]+'</b> ('+Math.round(cnt[k]/tot*100)+'%)</span>').join("")+'</div>';
  const per={}; bests.forEach(t=>(t.rounds||[]).forEach(x=>{ const p=per[x.r]=per[x.r]||{n:0,ok:0}; p.n+=x.n; p.ok+=x.ok; }));
  let bars="", ax="";
  for(let r=1;r<=50;r++){ const p=per[r];
    if(p&&p.n){ const pct=Math.round(p.ok/p.n*100); bars+='<div class="c" title="'+r+'회차 '+p.ok+'/'+p.n+' ('+pct+'%)"><i style="height:'+Math.max(pct,3)+'%;background:'+BLUE+';opacity:'+(0.45+pct/180)+'"></i></div>'; }
    else bars+='<div class="c no"><i></i></div>';
    ax+='<span>'+(r===1||r%5===0?r:"")+'</span>'; }
  h+='<div class="pc-sec">회차별 정답률 <span class="n">회차마다 5문항 · 완전 습득 + 추론</span></div><div class="pc-rchart">'+bars+'</div><div class="pc-rax">'+ax+'</div>';
  body.innerHTML=h;
}

// ── 실제 기록 → 화면 데이터 (Edge wordsense-unittest 'teacher' / 어드민센터가 보내 주는 묶음) ──
function fromReport(d){
  const lv=d.level||"초등", st=d.stats||{}, statOf=s=>(st.areas||[]).find(a=>a.slug===s)||{};
  const areas={}, rounds={};
  (d.areas||[]).forEach(a=>{
    const rs=(a.rounds||[]).map(x=>{ const total=x.total||0, found=x.known||0;
      const stt=!x.trained?"lock":(total>0&&found*10>=total*8)?"pass":"fail";
      return {r:x.r,c:x.c,h:x.h||"",total,found,st:stt,retry:x.retry||0}; });
    rounds[a.slug]=rs;
    const sa=statOf(a.slug);
    areas[a.slug]={cleared:rs.filter(r=>r.st==="pass").length, acq:Number(sa.acquired)||0, tot:Number(sa.total)||0,
      perfect:rs.filter(r=>r.st==="pass"&&r.total>0&&r.found>=r.total).length, retries:rs.reduce((n,r)=>n+(r.retry||0),0),
      first:a.first||"", last:a.last||""};
  });
  const p=d.profile||{};
  return { student:{name:p.name||("회원 "+d.member_no), school:lv==="중등"?"중학교":"초등학교", grade:p.grade||"", academy:p.academy||"", course:lv+"과정"},
    areas, rounds, totalAcq:Number(st.acquired_distinct)||0, totalTot:Number(st.total_distinct)||0,
    grades:(st.grades||[]).map(g=>({g:Number(g.g),acq:Number(g.acquired)||0,prov:Number(g.provided)||0})), tests:d.tests||[] };
}
function render(){ const s=D.student; course.textContent=s.course||((s.school||"").includes("중")?"중등과정":"초등과정"); sch.textContent=s.grade?(s.school+" "+s.grade+"학년"):""; nm.textContent=s.name; academy.textContent=s.academy; renderArea(); renderStats(); renderTests(); paint(); }
// 창 크기에 맞춰 가로세로 비율(760:1085) 유지하며 전체 스케일
const SHEET_W=760, SHEET_H=1085, FIT_PAD=16;
function fit(){ const sh=document.getElementById("sheet"),st=document.getElementById("stage"); if(!sh||!st)return;
  const s=Math.max(.2,Math.min((window.innerWidth-FIT_PAD*2)/SHEET_W,(window.innerHeight-FIT_PAD*2)/SHEET_H));
  sh.style.transform="scale("+s+")"; st.style.width=(SHEET_W*s)+"px"; st.style.height=(SHEET_H*s)+"px"; }
window.addEventListener("resize",fit);
// 인쇄: 팝업 시트 그대로 — 페이지마다 완전한 시트 1장씩(aspect-ratio로 팝업과 동일 비율)
let printClones=[];
function setupPrint(){ teardownPrint(); const sheet=document.getElementById("sheet"); if(!sheet)return;
  sheet.querySelectorAll(".pg").forEach((p,i)=>p.classList.toggle("on",i===0)); // 원본=1쪽
  for(let k=1;k<PAGES;k++){ const c=sheet.cloneNode(true); c.removeAttribute("id"); if(k===PAGES-1) c.classList.add("print-last");
    c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
    c.querySelectorAll(".pg").forEach((p,i)=>p.classList.toggle("on",i===k)); // 복제=k+1쪽
    c.style.transform="none"; sheet.parentNode.appendChild(c); printClones.push(c); } }
function teardownPrint(){ printClones.forEach(c=>c.remove()); printClones=[]; paint(); }

      rounds:[1,2,3,4,5].map(i=>({r:(unit-1)*5+i,n:5,ok:Math.max(1,Math.min(5,Math.round(score/20)+(i%2?0:-1)))}))}); };
