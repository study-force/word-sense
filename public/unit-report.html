<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>훈감각 단원평가 결과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  선생님용 단원평가 결과 보고서 (대표님 2026-10-17)
  - 공용 결과 폼(teacher-result.html)과 같은 틀: 760×1085 시트, 회색 헤더·푸터, 포인트 주황
  - 데이터: ?st=입장권 → Edge wordsense-unittest {action:'report'} (회원번호는 서버가 입장권에서 읽음)
  - ?st 없으면 데모 데이터
  - 1쪽: 영역별 단원 점수·결과 구성·회차별 정답률 / 2쪽: 급수별 결과(누적)·다시 볼 어휘
  - 같은 단원을 여러 번 봤으면 구성·정답률·급수·어휘는 '최근 응시' 기준 (재응시로 숫자가 부풀지 않게)
-->
<style>
  :root{
    --gray-h:#a3a3a3; --gray-h2:#999999; --ink:#2b2f36; --mut:#8b929c; --line:#e4e7ec; --accent:#cd5a29;
    --known:#2f9e73; --hanja:#e3b341; --hwrong:#efb4a4; --wrong:#d87878;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#dfe2e6;font-family:'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:auto}
  .stage{position:relative;flex:0 0 auto}
  .sheet{position:absolute;top:0;left:0;width:760px;height:1085px;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;transform-origin:top left}
  .hd{position:relative;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,var(--gray-h),var(--gray-h2));color:#fff;height:74px;padding:0 24px;flex:0 0 auto}
  .hd .htitle{font-size:22px;font-weight:600;letter-spacing:.01em;white-space:nowrap;line-height:1}
  .hd .htitle .hk{color:#FFE08A}
  .hd .course{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;opacity:.95;font-weight:600;white-space:nowrap}
  .hd .stu .sch{font-size:13.5px;opacity:.9} .hd .stu .nm{font-size:25px;font-weight:600;letter-spacing:.04em;margin-left:10px}
  .body{flex:1 1 auto;min-height:0;padding:30px 34px 10px;display:flex;flex-direction:column}
  .pg{display:none} .pg.on{display:block}
  .title{text-align:center;font-size:27px;font-weight:600;color:#666666;letter-spacing:.02em;margin:0 0 18px}
  .demo{position:absolute;top:84px;right:24px;font-size:11px;color:#b0b6be;border:1px solid #d9dde2;border-radius:3px;padding:2px 7px}

  /* 영역 탭 */
  .tabs{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
  .tab{padding:5px 13px;border-radius:999px;border:1.5px solid #e2e6ea;background:#fff;font-size:13px;font-weight:600;color:#8b929c;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .tab .dt{width:8px;height:8px;border-radius:50%}
  .tab.off{opacity:.45}
  .tab.on{color:#fff;border-color:transparent}

  /* 요약 4칸 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
  .kpi{background:#f3f5f7;border-radius:9px;padding:11px 8px 10px;text-align:center}
  .kpi .l{font-size:12.5px;color:var(--mut);font-weight:600}
  .kpi .v{font-size:27px;font-weight:600;color:#3b414a;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:13px;color:var(--mut);font-weight:500;margin-left:2px}

  .sec{font-size:15.5px;font-weight:600;color:#3b414a;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
  .sec .n{font-size:12px;color:#9aa0a8;font-weight:500}

  /* 단원 점수표 */
  table.ut{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:22px}
  table.ut th{font-size:11.5px;color:var(--mut);font-weight:600;padding:0 4px 5px;border-bottom:2px solid #d9dde2;text-align:center}
  table.ut td{padding:5px 4px;border-bottom:1px solid #eef0f2;text-align:center;color:#4a515b;height:31px}
  table.ut td.u{font-weight:600;color:#3b414a;text-align:left;padding-left:8px}
  table.ut td.r{color:#9aa0a8;font-size:12px}
  table.ut tr.none td{color:#c2c8cf}
  .sbar{height:11px;background:#eef0f2;border-radius:6px;overflow:hidden;width:100%}
  .sbar i{display:block;height:100%;border-radius:6px}
  .sc{font-weight:600;font-size:15px}
  .tri{font-size:12px;color:#9aa0a8}

  /* 결과 구성 막대 */
  .stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:#eef0f2}
  .stack i{display:block;height:100%}
  .leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:#6b727b;margin:8px 0 22px}
  .leg span b{font-weight:600;color:#3b414a;margin-left:3px;font-variant-numeric:tabular-nums}
  .leg .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  /* 회차별 정답률 */
  .rchart{display:grid;grid-template-columns:repeat(50,1fr);gap:2px;align-items:end;height:120px;border-bottom:1.5px solid #d9dde2;padding:0 1px}
  .rchart .c{position:relative;height:100%;display:flex;align-items:flex-end}
  .rchart .c i{display:block;width:100%;border-radius:2px 2px 0 0}
  .rchart .c.no i{background:#eef0f2;height:4px}
  .rax{display:grid;grid-template-columns:repeat(50,1fr);gap:2px;padding:0 1px;font-size:10px;color:#aeb4bc;margin-top:3px}
  .rax span{text-align:center}
  .rnote{font-size:11.5px;color:#9aa0a8;margin-top:6px}

  /* 2쪽: 급수별 */
  .gtab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:8px}
  .gtab th{font-size:11.5px;color:var(--mut);font-weight:600;padding:0 6px 5px;border-bottom:2px solid #d9dde2;text-align:center}
  .gtab td{padding:7px 6px;border-bottom:1px solid #eef0f2;text-align:center;color:#4a515b}
  .gtab td.g{font-weight:600;color:#3b414a;white-space:nowrap}
  .gtab td.g small{display:block;font-size:10.5px;color:#9aa0a8;font-weight:500}
  .gtab .stack{height:16px}
  .gtab td.p{font-weight:600;font-size:15px;color:#3b414a}
  .gnote{font-size:11.5px;color:#9aa0a8;margin-bottom:28px}

  /* 다시 볼 어휘 */
  .words{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  .w{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;padding:6px 2px;border-bottom:1px solid #eef0f2;font-size:13px;align-items:baseline}
  .w b{font-weight:600;color:#2b2f36;font-size:14px;white-space:nowrap}
  .w b em{font-style:normal;font-family:'Noto Serif CJK KR','Noto Serif KR',serif;color:#9aa0a8;font-weight:400;font-size:13px;margin-left:5px}
  .w .m{color:#5a616b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .w .t{grid-column:1/-1;font-size:11px;color:#aeb4bc}
  .w .t .k{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:0}
  .more{font-size:12px;color:#9aa0a8;text-align:right;margin-top:6px}
  .empty{color:#aeb4bc;font-size:13.5px;text-align:center;padding:26px 0}

  .src{font-size:10.5px;color:#aeb4bc;text-align:center;padding:14px 0 2px}
  /* foot + nav (공용 폼과 동일) */
  .footbar{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 24px 16px;flex:0 0 auto}
  .footbar .btn{background:#5a616b;color:#fff;border:none;border-radius:4px;padding:7px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
  .footbar .pgnav{display:flex;align-items:center;gap:14px}
  .footbar .pa{box-sizing:content-box;width:0;height:0;background:none;border-style:solid;cursor:pointer;padding:0}
  .footbar .pa.l{border-width:19px 28px 19px 0;border-color:transparent #666666 transparent transparent}
  .footbar .pa.r{border-width:19px 0 19px 28px;border-color:transparent transparent transparent #cd5a29}
  .foot{background:#cccccc;display:flex;align-items:center;justify-content:center;height:29px;padding:0 24px;flex:0 0 auto}
  .foot .ac2{font-size:16px;line-height:1;color:#333333;font-weight:600;position:relative;top:-2px}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#5a616b}
  @media print{
    body{background:#fff;display:block;height:auto;margin:0}
    .stage{position:static!important;transform:none!important;width:auto!important;height:auto!important;display:block}
    .sheet{position:static!important;transform:none!important;box-shadow:none;width:100%;height:auto;zoom:1;margin:0;display:flex;flex-direction:column;overflow:hidden;page-break-after:always;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .print-sheet2{page-break-after:auto}
    .noprint,.footbar,.demo{display:none!important}
    .foot{margin-top:38px}
    @page{size:A4 portrait;margin:5mm}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
  <div class="sheet" id="sheet">
    <div class="hd">
      <div class="htitle">한자어<span class="hk">[훈]</span>독해</div>
      <div class="course" id="course"></div>
      <div class="stu"><span class="sch" id="sch"></span><span class="nm" id="nm"></span></div>
    </div>
    <div class="demo" id="demo" hidden>예시 데이터</div>
    <div class="body">
      <div class="pg on" id="pg1">
        <div class="title">단원평가 결과</div>
        <div class="tabs" id="tabs"></div>
        <div class="kpis" id="kpis"></div>
        <div class="sec">단원별 점수 <span class="n">5회차마다 25문항 · 100점 만점</span></div>
        <table class="ut" id="units"></table>
        <div class="sec">결과 구성 <span class="n" id="mixN"></span></div>
        <div class="stack" id="mix"></div>
        <div class="leg" id="mixLeg"></div>
        <div class="sec">회차별 정답률 <span class="n">회차마다 5문항 · 바로 앎 + 한자로 풂</span></div>
        <div class="rchart" id="rchart"></div>
        <div class="rax" id="rax"></div>
      </div>
      <div class="pg" id="pg2">
        <div class="title">급수별 결과 · 다시 볼 어휘</div>
        <div class="sec">급수별 결과 <span class="n" id="gN"></span></div>
        <table class="gtab" id="gtab"></table>
        <div class="leg" id="gLeg" style="margin:4px 0 6px"></div>
        <div class="gnote">급수: 국립국어원 한국어 기초 어휘 등급 · 응시한 모든 단원평가를 합산 (같은 단원은 최근 응시 기준)</div>
        <div class="sec">다시 볼 어휘 <span class="n" id="wN"></span></div>
        <div class="words" id="words"></div>
        <div class="more" id="more"></div>
        <div class="src">출처: 국립국어원 한국어 기초 어휘 · 표준국어대사전</div>
      </div>
    </div>
    <div class="footbar noprint">
      <button class="btn print" onclick="window.print()">선택 출력</button>
      <div class="pgnav">
        <button class="pa l" id="navL" onclick="go(-1)" aria-label="이전"></button>
        <button class="pa r" id="navR" onclick="go(1)" aria-label="다음"></button>
      </div>
    </div>
    <div class="foot"><div class="ac2" id="academy"></div></div>
  </div>
  </div>
<script>
// ── 테섭/실섭 분기 (data-supabase.js와 같은 규칙) ──
const _host = location.hostname;
const IS_TEST_HOST = _host === 'word.sfos.kr' || _host === 'localhost' || _host === '127.0.0.1';
const API = IS_TEST_HOST
  ? { url: 'https://xzxgsqpvtckxgvipchsy.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6eGdzcXB2dGNreGd2aXBjaHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5OTU0NjIsImV4cCI6MjA5NDU3MTQ2Mn0.J0OIH7pk11wwuyyJEO--RF54jf-AfxqJ19ECwAnsmSQ' }
  : { url: 'https://fokuojmzhttxfkmiutmf.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZva3Vvam16aHR0eGZrbWl1dG1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MDYwOTksImV4cCI6MjA5MzM4MjA5OX0.FuYv59ufKteXKusvAhJktBNWntMnWmxctQoHquaPKVA' };

const AREAS = [["생물","biology"],["사회","society"],["역사","history"],["과학","science"],["문화","culture"],["경제","economy"]];
const COLOR = {biology:"#5EBE7E",society:"#A87BD6",history:"#E5C257",science:"#8FA0BD",culture:"#E889A8",economy:"#7BB6E6"};
const RES = [["known","바로 앎","var(--known)"],["hanja","한자로 풂","var(--hanja)"],["hanja_wrong","한자 보고도 틀림","var(--hwrong)"],["wrong","틀림","var(--wrong)"]];
const GRADE_YR = {1:'취학 전',2:'초1~2',3:'초3~4',4:'초5~6',5:'중1~3'};
// 점수 색 — 공용 폼 범례 (100 / 90~99 / 80~89 / 0~79)
const scoreColor = s => s >= 100 ? '#246ce3' : s >= 90 ? '#009900' : s >= 80 ? '#e46600' : '#cc0000';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd = t => t ? new Date(t).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }) : '';
const mmss = ms => { const s = Math.round((ms || 0) / 1000); return Math.floor(s / 60) + '분 ' + String(s % 60).padStart(2, '0') + '초'; };

let R = null, curArea = 'biology', page = 1;

// ── 데모 데이터 (입장권 없이 열었을 때) ──
function demoData(){
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const words = [["체온","體溫","몸의 온도"],["생명","生命","살아 있게 하는 힘"],["천연","天然","사람이 손대지 않은 그대로"],["개화","開花","꽃이 핌"],["동물","動物","움직이며 사는 생물"],["액화","液化","기체나 고체가 액체로 변함"],["식비","食費","끼니를 먹는 데 드는 돈"],["특종","特種","같은 종류 가운데 두드러지게 다른 보도"],["가능","可能","할 수 있거나 될 수 있음"],["화석","化石","옛 생물의 자취가 돌에 굳어 남은 것"],["과식","過食","지나치게 많이 먹음"],["지능","知能","깊이 생각하고 일을 풀어내는 머리의 힘"],["친척","親戚","핏줄이나 혼인으로 맺어진 사람"],["행인","行人","길을 가는 사람"],["중심","中心","한가운데"]];
  const plan = { 1:[[1,[72,84]],[2,[88]],[3,[96]],[4,[80]]], 2:[[1,[64,76]],[2,[92]]], 5:[[1,[100]]] };
  const attempts = [], answers = []; let id = 0;
  Object.entries(plan).forEach(([area, units]) => units.forEach(([unit, scores]) => scores.forEach((score, k) => {
    id++; const day = new Date(2026, 7, 20 + unit * 6 + k * 2 + Number(area));
    const n = { known: 0, hanja: 0, hanja_wrong: 0, wrong: 0 };
    for(let o = 1; o <= 25; o++){
      const p = rnd(), base = score / 100;
      const r = p < base * 0.86 ? 'known' : p < base ? 'hanja' : p < base + (1 - base) * 0.4 ? 'hanja_wrong' : 'wrong';
      n[r]++; const w = words[Math.floor(rnd() * words.length)];
      const g = 1 + Math.min(4, Math.floor(rnd() * rnd() * 6));
      answers.push({ attempt_id: id, ord: o, round_no: (unit - 1) * 5 + 1 + Math.floor((o - 1) / 5), grade: g, word: w[0], hanja: w[1], choices: [w[2]], correct_idx: 0, result: r });
    }
    attempts.push({ id, level: '초등', area_id: Number(area), unit, round_from: (unit - 1) * 5 + 1, round_to: unit * 5,
      finished_at: day.toISOString(), duration_ms: 180000 + Math.floor(rnd() * 120000),
      n_known: n.known, n_hanja: n.hanja, n_hanja_wrong: n.hanja_wrong, n_wrong: n.wrong,
      score: Math.round((n.known * 4 + n.hanja * 2) * 100 / 100) });
  })));
  return { demo: true, profile: { name: '김건희', school_level: '초등', grade: 6, center: '공부의철인(분당본원)' },
    areas: AREAS.map(([ko, slug], i) => ({ id: i + 1, slug, name_ko: ko })), attempts, answers };
}

// ── 데이터 정리 ──
function prepare(d){
  const slugOf = {}; (d.areas || []).forEach(a => slugOf[a.id] = a.slug);
  const byAtt = {}; (d.answers || []).forEach(x => (byAtt[x.attempt_id] = byAtt[x.attempt_id] || []).push(x));
  const atts = (d.attempts || []).map(a => ({ ...a, slug: slugOf[a.area_id], items: byAtt[a.id] || [] }));
  // 과정: 가장 최근 응시의 과정 (없으면 프로필 학교급)
  const level = atts.length ? atts[atts.length - 1].level : ((d.profile && d.profile.school_level) === '중등' ? '중등' : '초등');
  const mine = atts.filter(a => a.level === level);
  // 단원별: 응시 순서대로 묶음
  const units = {};   // slug → unit → [attempts]
  mine.forEach(a => { const s = units[a.slug] = units[a.slug] || {}; (s[a.unit] = s[a.unit] || []).push(a); });
  const latest = []; Object.values(units).forEach(us => Object.values(us).forEach(list => latest.push(list[list.length - 1])));
  return { ...d, level, units, latest };
}

// ── 1쪽: 영역 ──
function renderArea(){
  const slug = curArea, col = COLOR[slug], us = R.units[slug] || {};
  document.getElementById('tabs').innerHTML = AREAS.map(([ko, s]) => {
    const has = !!R.units[s], on = s === slug;
    return '<div class="tab' + (on ? ' on' : '') + (has ? '' : ' off') + '" onclick="curArea=\'' + s + '\';renderArea()" style="' + (on ? 'background:' + COLOR[s] : '') + '"><span class="dt" style="background:' + (on ? '#fff' : COLOR[s]) + '"></span>' + ko + '</div>';
  }).join('');

  const lists = Object.values(us), lastOf = l => l[l.length - 1];
  const lastScores = lists.map(l => lastOf(l).score), tries = lists.reduce((t, l) => t + l.length, 0);
  const avg = lastScores.length ? Math.round(lastScores.reduce((a, b) => a + b, 0) / lastScores.length) : null;
  const best = lists.length ? Math.max(...lists.map(l => Math.max(...l.map(a => a.score)))) : null;
  document.getElementById('kpis').innerHTML =
    kpi('응시 단원', lists.length, ' / 10') +
    kpi('평균 점수', avg == null ? '–' : avg, avg == null ? '' : '점', avg == null ? '' : scoreColor(avg)) +
    kpi('최고 점수', best == null ? '–' : best, best == null ? '' : '점', best == null ? '' : scoreColor(best)) +
    kpi('응시 횟수', tries, '회');

  let rows = '<tr><th style="width:62px;text-align:left;padding-left:8px">단원</th><th style="width:66px">회차</th><th>최근 점수</th><th style="width:46px"></th><th style="width:52px">첫 점수</th><th style="width:52px">최고</th><th style="width:44px">횟수</th><th style="width:72px">걸린 시간</th><th style="width:84px">응시일</th></tr>';
  for(let u = 1; u <= 10; u++){
    const l = us[u], rr = ((u - 1) * 5 + 1) + '~' + (u * 5);
    if(!l){ rows += '<tr class="none"><td class="u" style="color:#c2c8cf">' + u + '단원</td><td class="r">' + rr + '</td><td><div class="sbar"></div></td><td>–</td><td></td><td></td><td></td><td></td><td></td></tr>'; continue; }
    const a = lastOf(l), sc = a.score, b = Math.max(...l.map(x => x.score));
    rows += '<tr><td class="u">' + u + '단원</td><td class="r">' + rr + '</td>'
      + '<td><div class="sbar"><i style="width:' + Math.max(sc, 2) + '%;background:' + scoreColor(sc) + '"></i></div></td>'
      + '<td class="sc" style="color:' + scoreColor(sc) + '">' + sc + '</td>'
      + '<td>' + l[0].score + '</td><td>' + b + '</td><td class="tri">' + l.length + '회</td>'
      + '<td class="tri">' + mmss(a.duration_ms) + '</td><td class="tri">' + ymd(a.finished_at) + '</td></tr>';
  }
  document.getElementById('units').innerHTML = rows;

  // 결과 구성 — 이 영역 단원들의 최근 응시 합산
  const last = lists.map(lastOf), cnt = { known: 0, hanja: 0, hanja_wrong: 0, wrong: 0 };
  last.forEach(a => { cnt.known += a.n_known || 0; cnt.hanja += a.n_hanja || 0; cnt.hanja_wrong += a.n_hanja_wrong || 0; cnt.wrong += a.n_wrong || 0; });
  const tot = cnt.known + cnt.hanja + cnt.hanja_wrong + cnt.wrong;
  document.getElementById('mixN').textContent = tot ? '최근 응시 ' + last.length + '개 단원 · ' + tot + '문항' : '';
  document.getElementById('mix').innerHTML = tot ? RES.map(([k, , c]) => cnt[k] ? '<i style="width:' + (cnt[k] / tot * 100) + '%;background:' + c + '"></i>' : '').join('') : '';
  document.getElementById('mixLeg').innerHTML = RES.map(([k, ko, c]) => '<span><i class="sw" style="background:' + c + '"></i>' + ko + '<b>' + cnt[k] + '</b>' + (tot ? ' (' + Math.round(cnt[k] / tot * 100) + '%)' : '') + '</span>').join('');

  // 회차별 정답률 — 최근 응시의 회차별 5문항
  const per = {}; last.forEach(a => a.items.forEach(x => { const p = per[x.round_no] = per[x.round_no] || { n: 0, ok: 0 }; p.n++; if(x.result === 'known' || x.result === 'hanja') p.ok++; }));
  let bars = '', ax = '';
  for(let r = 1; r <= 50; r++){
    const p = per[r];
    if(p && p.n){ const pct = Math.round(p.ok / p.n * 100);
      bars += '<div class="c" title="' + r + '회차 ' + p.ok + '/' + p.n + ' (' + pct + '%)"><i style="height:' + Math.max(pct, 3) + '%;background:' + col + ';opacity:' + (0.45 + pct / 180) + '"></i></div>'; }
    else bars += '<div class="c no" title="' + r + '회차 미응시"><i></i></div>';
    ax += '<span>' + (r === 1 || r % 5 === 0 ? r : '') + '</span>';
  }
  document.getElementById('rchart').innerHTML = bars;
  document.getElementById('rax').innerHTML = ax;
}
function kpi(l, v, unit, color){ return '<div class="kpi"><div class="l">' + l + '</div><div class="v"' + (color ? ' style="color:' + color + '"' : '') + '>' + v + '<small>' + unit + '</small></div></div>'; }

// ── 2쪽: 급수별 · 다시 볼 어휘 (전 영역, 최근 응시 기준) ──
function renderAll(){
  const items = []; R.latest.forEach(a => a.items.forEach(x => items.push({ ...x, slug: a.slug, unit: a.unit })));
  const g = {}; items.forEach(x => { if(x.grade == null) return; const o = g[x.grade] = g[x.grade] || { known: 0, hanja: 0, hanja_wrong: 0, wrong: 0, n: 0 }; o[x.result] = (o[x.result] || 0) + 1; o.n++; });
  const gs = Object.keys(g).map(Number).sort((a, b) => a - b);
  document.getElementById('gN').textContent = items.length ? '단원평가 ' + R.latest.length + '개 · ' + items.length + '문항' : '';
  document.getElementById('gtab').innerHTML = gs.length
    ? '<tr><th style="width:84px">급수</th><th style="width:60px">문항</th><th>결과 구성</th><th style="width:70px">정답률</th><th style="width:60px">바로 앎</th></tr>'
      + gs.map(k => { const o = g[k], ok = o.known + o.hanja;
          return '<tr><td class="g">' + k + '급<small>' + (GRADE_YR[k] || '') + '</small></td><td>' + o.n + '</td>'
            + '<td><div class="stack">' + RES.map(([r, , c]) => o[r] ? '<i style="width:' + (o[r] / o.n * 100) + '%;background:' + c + '"></i>' : '').join('') + '</div></td>'
            + '<td class="p">' + Math.round(ok / o.n * 100) + '%</td><td>' + Math.round(o.known / o.n * 100) + '%</td></tr>'; }).join('')
    : '<tr><td class="empty">아직 응시한 단원평가가 없어요</td></tr>';

  document.getElementById('gLeg').innerHTML = gs.length ? RES.map(([k, ko, c]) => '<span><i class="sw" style="background:' + c + '"></i>' + ko + '</span>').join('') : '';
  // 다시 볼 어휘 — 최근 응시에서 맞히지 못한 어휘 (같은 어휘는 한 번만)
  const seen = new Set(), wl = [];
  items.filter(x => x.result === 'hanja_wrong' || x.result === 'wrong').forEach(x => { const k = x.word + '|' + x.hanja; if(seen.has(k)) return; seen.add(k); wl.push(x); });
  const MAX = 24, ko = s => (AREAS.find(a => a[1] === s) || [''])[0];
  document.getElementById('wN').textContent = wl.length ? wl.length + '개 · 최근 응시에서 맞히지 못한 어휘' : '';
  document.getElementById('words').innerHTML = wl.length
    ? wl.slice(0, MAX).map(x => '<div class="w"><b>' + esc(x.word) + '<em>' + esc(x.hanja || '') + '</em></b><span class="m">' + esc((x.choices || [])[x.correct_idx] || '') + '</span>'
        + '<span class="t"><i class="k" style="background:' + COLOR[x.slug] + '"></i>' + ko(x.slug) + ' ' + x.round_no + '회차' + (x.grade ? ' · ' + x.grade + '급' : '') + (x.result === 'hanja_wrong' ? ' · 한자 보고도 틀림' : '') + '</span></div>').join('')
    : '<div class="empty" style="grid-column:1/-1">' + (items.length ? '모든 어휘를 맞혔어요' : '아직 응시한 단원평가가 없어요') + '</div>';
  document.getElementById('more').textContent = wl.length > MAX ? '외 ' + (wl.length - MAX) + '개' : '';
}

function paint(){ pg1.classList.toggle('on', page === 1); pg2.classList.toggle('on', page === 2);
  navL.style.borderRightColor = page > 1 ? '#666666' : '#cccccc'; navR.style.borderLeftColor = page < 2 ? '#cd5a29' : '#cccccc'; }
function go(d){ page = Math.min(2, Math.max(1, page + d)); paint(); }
function render(){
  const p = R.profile || {};
  course.textContent = R.level + '과정';
  sch.textContent = p.grade ? (p.school_level || R.level) + ' ' + p.grade + '학년' : '';
  nm.textContent = p.name || (R.member_no ? '회원 ' + R.member_no : '');
  academy.textContent = p.center || '';
  document.getElementById('demo').hidden = !R.demo;
  // 기본 탭: 가장 최근에 응시한 영역
  const lastA = R.latest.slice().sort((a, b) => String(a.finished_at).localeCompare(String(b.finished_at))).pop();
  curArea = lastA ? lastA.slug : 'biology';
  renderArea(); renderAll(); paint();
}

// 창 크기에 맞춰 비율(760:1085) 유지 — 공용 폼과 동일
const SHEET_W = 760, SHEET_H = 1085, FIT_PAD = 16;
function fit(){ const sh = document.getElementById('sheet'), st = document.getElementById('stage');
  const s = Math.max(.2, Math.min((innerWidth - FIT_PAD * 2) / SHEET_W, (innerHeight - FIT_PAD * 2) / SHEET_H));
  sh.style.transform = 'scale(' + s + ')'; st.style.width = (SHEET_W * s) + 'px'; st.style.height = (SHEET_H * s) + 'px'; }
addEventListener('resize', fit);
// 인쇄: 쪽마다 완전한 시트 1장씩 (공용 폼과 동일 방식)
let printClone = null;
function setupPrint(){ teardownPrint(); const sheet = document.getElementById('sheet');
  sheet.querySelectorAll('.pg').forEach((p, i) => p.classList.toggle('on', i === 0));
  printClone = sheet.cloneNode(true); printClone.removeAttribute('id'); printClone.classList.add('print-sheet2');
  printClone.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  printClone.querySelectorAll('.pg').forEach((p, i) => p.classList.toggle('on', i === 1));
  printClone.style.transform = 'none'; sheet.parentNode.appendChild(printClone); }
function teardownPrint(){ if(printClone){ printClone.remove(); printClone = null; } paint(); }
addEventListener('beforeprint', setupPrint);
addEventListener('afterprint', teardownPrint);

(async function(){
  const st = new URLSearchParams(location.search).get('st');
  let d = null;
  if(st){
    try {
      const r = await fetch(API.url + '/functions/v1/wordsense-unittest', { method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: API.key }, body: JSON.stringify({ action: 'report', ticket: st }) });
      d = await r.json();
    } catch(e){ d = { success: false, message: '연결이 불안정해요' }; }
    if(!d || !d.success){
      document.body.innerHTML = '<div class="msg">결과를 불러오지 못했어요. ' + esc((d && d.message) || '') + '</div>'; return;
    }
  } else d = demoData();
  R = prepare(d); render(); fit();
})();
</script>
