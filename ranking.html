<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>훈감각 어휘 랭킹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 훈감각 공통 랭킹판 — 홈페이지에 링크/iframe으로 넣는 화면 (대표님 2026-10-16)
   기간(오늘·이번 주·이번 달) × 과정(통합·초등·중등) × 범위(전국·우리학원)
   점수 = 그 기간에 새로 '내 어휘'가 된 수. 여러 회차·재훈련 모두 합산. 이름은 서버에서 가림(홍*동) */
:root {
  --bg: #F4F6FA; --card: #FFFFFF; --ink: #1A1F30; --sub: #6B7488; --line: #E6E9F0;
  --green: #2FA572; --green-soft: #E7F6EE; --gold: #E0A800; --me: #FFF7DB;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
.lead { font-size: 14px; color: var(--sub); margin: 0 0 18px; line-height: 1.6; }
.filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.seg { display: flex; background: #E3E7EF; border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 4px; border-radius: 8px; font: inherit; font-size: 15px; font-weight: 500; color: var(--sub); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.seg button:disabled { opacity: .45; cursor: default; }
.row-label { font-size: 12px; color: var(--sub); margin: 0 0 4px 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 10px; }
.card-head .t { font-size: 16px; font-weight: 600; }
.card-head .r { font-size: 13px; color: var(--sub); white-space: nowrap; }
.me-bar { background: var(--me); padding: 10px 18px; font-size: 14px; border-bottom: 1px solid var(--line); }
.me-bar b { font-weight: 600; color: var(--green); }
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #F0F2F6; }
.item:last-child { border-bottom: 0; }
.item.me { background: var(--me); }
.rk { width: 34px; text-align: center; font-size: 16px; font-weight: 600; color: var(--sub); flex: none; }
.rk.medal { font-size: 22px; }
.who { flex: 1; min-width: 0; }
.nm { font-size: 16px; font-weight: 500; }
.ac { font-size: 12px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt { font-size: 17px; font-weight: 600; color: var(--green); flex: none; }
.cnt small { font-size: 12px; font-weight: 500; color: var(--sub); margin-left: 2px; }
.empty, .loading { padding: 40px 18px; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.7; }
.spin { width: 28px; height: 28px; margin: 0 auto 10px; border: 3px solid var(--green-soft); border-top-color: var(--green); border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.foot { font-size: 12px; color: var(--sub); margin-top: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 훈감각 어휘 랭킹</h1>
  <p class="lead">새로 <b>'내 어휘'</b>로 익힌 어휘 수로 겨뤄요. 여러 회차·다시 훈련에서 새로 익힌 어휘가 모두 더해져요.</p>

  <div class="filters">
    <div><div class="row-label">기간</div><div class="seg" id="f-period">
      <button data-v="day">오늘</button><button data-v="week">이번 주</button><button data-v="month">이번 달</button></div></div>
    <div><div class="row-label">과정</div><div class="seg" id="f-level">
      <button data-v="">통합</button><button data-v="초등">초등</button><button data-v="중등">중등</button></div></div>
    <div><div class="row-label">범위</div><div class="seg" id="f-scope">
      <button data-v="all">전국</button><button data-v="academy" id="btn-academy">우리학원</button></div></div>
  </div>

  <div class="card">
    <div class="card-head"><span class="t" id="title"></span><span class="r" id="range"></span></div>
    <div class="me-bar" id="me-bar" hidden></div>
    <div id="body"><div class="loading"><div class="spin"></div>불러오는 중이에요</div></div>
  </div>
  <div class="foot">· 이름은 일부를 가려서 보여 줘요.<br>· 오늘은 매일, 이번 주는 매주 월요일, 이번 달은 매달 1일에 0부터 다시 시작해요.</div>
</div>

<script>
(function(){
  // 서버 — 테섭(word.sfos.kr·localhost)은 테스트 DB, 그 밖은 운영 DB (훈련 앱과 같은 규칙)
  var host = location.hostname;
  var TEST = host === 'word.sfos.kr' || host === 'localhost' || host === '127.0.0.1';
  var URL_ = TEST ? 'https://xzxgsqpvtckxgvipchsy.supabase.co' : 'https://fokuojmzhttxfkmiutmf.supabase.co';
  var KEY_ = TEST ? 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6eGdzcXB2dGNreGd2aXBjaHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5OTU0NjIsImV4cCI6MjA5NDU3MTQ2Mn0.J0OIH7pk11wwuyyJEO--RF54jf-AfxqJ19ECwAnsmSQ' : 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZva3Vvam16aHR0eGZrbWl1dG1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MDYwOTksImV4cCI6MjA5MzM4MjA5OX0.FuYv59ufKteXKusvAhJktBNWntMnWmxctQoHquaPKVA';

  var q = new URLSearchParams(location.search);
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  // 우리학원: 주소의 ?academy=학원번호 (훈련 앱 결과 화면·홈페이지에서 넘겨줌) → 이 브라우저에 기억
  var academy = q.get('academy') || lsGet('ws_rank_academy');
  if (q.get('academy')) lsSet('ws_rank_academy', q.get('academy'));
  var me = q.get('me');   // 훈련 앱에서 열었을 때 '나' 표시

  var st = {
    period: ['day', 'week', 'month'].indexOf(q.get('period')) > -1 ? q.get('period') : 'day',
    level: ['초등', '중등'].indexOf(q.get('level')) > -1 ? q.get('level') : '',
    scope: academy && q.get('scope') !== 'all' ? 'academy' : 'all'
  };
  if (!academy) { var ba = document.getElementById('btn-academy'); ba.disabled = true; ba.title = '훈련 화면의 랭킹 버튼으로 들어오면 볼 수 있어요'; }

  function bindSeg(id, key){
    var el = document.getElementById(id);
    function paint(){ el.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === st[key]); }); }
    el.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b || b.disabled) return;
      st[key] = b.dataset.v; paint(); load();
    });
    paint();
  }
  bindSeg('f-period', 'period'); bindSeg('f-level', 'level'); bindSeg('f-scope', 'scope');

  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function fmtDay(d){ var p = String(d).split('-'); return Number(p[1]) + '월 ' + Number(p[2]) + '일'; }
  var PERIOD = { day: '오늘', week: '이번 주', month: '이번 달' };
  var seq = 0;

  function load(){
    var my = ++seq;
    var body = document.getElementById('body');
    body.innerHTML = '<div class="loading"><div class="spin"></div>불러오는 중이에요</div>';
    fetch(URL_ + '/rest/v1/rpc/wordsense_rank_board', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY_, Authorization: 'Bearer ' + KEY_ },
      body: JSON.stringify({ p_period: st.period, p_level: st.level || null,
        p_academy_no: st.scope === 'academy' && academy ? Number(academy) : null,
        p_limit: 50, p_member_no: me ? Number(me) : null })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (my !== seq) return;
      if (!d || !d.rows) throw new Error((d && d.message) || '불러오지 못했어요');
      var scopeName = st.scope === 'academy' ? (d.academy_name || '우리학원') : '전국';
      document.getElementById('title').textContent = PERIOD[st.period] + ' · ' + (st.level || '초등·중등 통합') + ' · ' + scopeName;
      document.getElementById('range').textContent = d.from === d.to ? fmtDay(d.to) : fmtDay(d.from) + ' ~ ' + fmtDay(d.to);
      var mb = document.getElementById('me-bar');
      if (me && d.me) { mb.hidden = false; mb.innerHTML = '나는 <b>' + d.me.rank + '위</b> · 새로 익힌 어휘 <b>' + d.me.count + '개</b> (참여 ' + d.total + '명)'; }
      else if (me) { mb.hidden = false; mb.textContent = '이 기간에 새로 익힌 어휘가 아직 없어요. 훈련하면 순위에 올라가요!'; }
      else mb.hidden = true;
      if (!d.rows.length) { body.innerHTML = '<div class="empty">아직 이 기간에 기록이 없어요.<br>먼저 훈련하고 1등을 차지해 보세요! 🚀</div>'; return; }
      var medals = ['🥇', '🥈', '🥉'];
      body.innerHTML = '<ol class="list">' + d.rows.map(function(r){
        var m = r.rank <= 3;
        return '<li class="item' + (r.me ? ' me' : '') + '"><span class="rk' + (m ? ' medal' : '') + '">' + (m ? medals[r.rank - 1] : r.rank) + '</span>'
          + '<div class="who"><div class="nm">' + esc(r.name) + (r.me ? ' (나)' : '') + '</div>' + (r.academy ? '<div class="ac">' + esc(r.academy) + '</div>' : '') + '</div>'
          + '<span class="cnt">' + r.count + '<small>개</small></span></li>';
      }).join('') + '</ol>';
    }).catch(function(e){
      if (my !== seq) return;
      body.innerHTML = '<div class="empty">랭킹을 불러오지 못했어요. 잠시 후 다시 열어 주세요.</div>';
      console.error('[ranking]', e);
    });
  }
  load();
})();
</script>
</body>
</html>
